[package]
name = "ironwood-verifier-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironwood-intent-escrow = { path = "../..", default-features = false }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
