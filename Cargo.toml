[package]
name = "ironwood-intent-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "A 2-of-3 FROST escrow on Zcash Ironwood that fills on NEAR testnet or refunds to a fresh shielded address"
license = "MIT OR Apache-2.0"

[dependencies]
# FROST: docs/decisions/stack.md pins these. reddsa 0.5.2 is the last version
# with the RedPallas FROST ciphersuite; orchard pulls reddsa 0.6 beside it.
frost-core = "3.0.0"
frost-rerandomized = "3.0.0"
reddsa = { version = "0.5.2", features = ["frost"] }

# librustzcash, Ironwood-capable releases of 2026-10-21.
orchard = "0.16.0"
zcash_primitives = "0.31.0"
pczt = { version = "0.10.0", features = ["orchard", "prover", "signer", "io-finalizer", "tx-extractor", "zcp-builder"] }
zcash_client_backend = { version = "0.25.0", features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "pczt", "sync"] }
zcash_client_sqlite = { version = "0.23.0", features = ["orchard", "transparent-inputs"] }
zcash_keys = { version = "0.17.0", features = ["orchard"] }
zip32 = "0.3"
zcash_address = "0.14.0"
zcash_protocol = "0.11.0"

# orchard's own curve version, for the zero randomizer that reads ask's bytes
# and for alpha on the orchard side of the reddsa boundary (stack.md).
pasta_curves = "0.6.1"
# The FROST side (frost-core, reddsa 0.5.2) uses rand_core 0.6.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

# The payer wallet (stack.md, Funding): zcash_client_sqlite takes a rand 0.10
# RNG and secrecy seeds. The light servers are gRPC over TLS on port 443;
# ring is the rustls provider because aws-lc-rs needs cmake.
async-trait = "0.1"
rand = { version = "0.10", features = ["sys_rng"] }
base64 = "0.22"
hex = "0.4"
rusqlite = "0.37"
# The archival NEAR RPC is one HTTPS POST; rustls with ring and the webpki
# roots are already in the tree through the light server path.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
shardtree = "0.8"
secrecy = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
incrementalmerkletree = "0.9"
zcash_transparent = "0.11"
tempfile = "3"

# Proving an Ironwood action in a debug build is slow: the proving key alone
# takes 11.9 s unoptimized against 0.9 s optimized (stack.md, Prover). Tests
# prove transactions, so dependencies build optimized; this crate does not,
# so its own debug assertions still run.
[profile.dev.package."*"]
opt-level = 3
